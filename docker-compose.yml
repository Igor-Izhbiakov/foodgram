volumes:
  pg_data_dev:
  django_static_dev:
  react_static_dev:
  media_value_dev:

services:
  db:
    image: postgres:15-alpine
    container_name: foodgram-db-dev
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    env_file:
      - .env

  backend:
    build: ./backend/
    container_name: foodgram-backend-dev
    volumes:
      - django_static_dev:/backend_static/
      - media_value_dev:/app/media/
      - ./backend/:/app/ 
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build: ./frontend/
    container_name: foodgram-front-dev
    env_file:
      - .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - react_static_dev:/frontend_static/

  nginx:
    build: ./gateway/
    container_name: foodgram-proxy-dev
    ports:
      - "8000:80"
    volumes:
      - django_static_dev:/django_static/
      - react_static_dev:/react_static/ 
      - media_value_dev:/app/media/
    depends_on:
      - backend
      - frontend