server {
    listen 80;
    client_max_body_size 20M;
    server_tokens off;

    location /api/docs/ {
        root /staticfiles/;
        try_files $uri $uri/redoc.html =404;
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        root /staticfiles/;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}