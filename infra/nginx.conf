server {
  listen 80;
  server_name 158.160.193.212 localhost yourfoodgram.duckdns.org;
  index index.html;

  server_tokens off;
  client_max_body_size 20M;

  location /api/docs/ {
    root /staticfiles/;
    try_files $uri $uri/redoc.html =404;
  }

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000;
  }

  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000;
  }

  location /static/admin/ {
    root /staticfiles/;
  }

  location /static/rest_framework/ {
    root /staticfiles/;
  }

  location /media/ {
    alias /app/media/;
  }
  
  location / {
    root /staticfiles/;
    try_files $uri $uri/ /index.html;
  }
}