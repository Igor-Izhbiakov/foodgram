version: '3.8'

volumes:
  pg_data:
  static_value:
  media_value:

services:
  db:
    image: postgres:15-alpine
    container_name: foodgram-db-local
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=foodgram
      - POSTGRES_USER=foodgram_user
      - POSTGRES_PASSWORD=foodgram_password

  backend:
    build: ../backend/
    container_name: foodgram-backend-local
    restart: always
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
    depends_on:
      - db
    environment:
      - POSTGRES_DB=foodgram
      - POSTGRES_USER=foodgram_user
      - POSTGRES_PASSWORD=foodgram_password
      - DB_HOST=db
      - DB_PORT=5432

  frontend:
    build: ../frontend/
    container_name: foodgram-front-local
    volumes:
      - static_value:/app/result_static/

  nginx:
    image: ${DOCKER_USERNAME}/foodgram_gateway:latest 
    container_name: foodgram-proxy-local
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_value:/usr/share/nginx/html/
      - media_value:/app/media/
    depends_on:
      - backend
      - frontend